<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | КиноВселенная</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="bg-glow"></div>

    <header class="header header-auth">
        <div class="header-inner" style="justify-content: center;">
            <a href="index.html" class="logo">
                КиноВселенная
            </a>
        </div>
    </header>

    <main class="main">
        <div class="auth-wrapper">
            <div class="glass-card auth-card">
                <h2>Добро пожаловать</h2>
                <p class="subtitle">Войдите или создайте аккаунт</p>

                <div class="tabs tabs-auth">
                    <button type="button" class="tab active" data-tab="login">Вход</button>
                    <button type="button" class="tab" data-tab="register">Регистрация</button>
                </div>

                <form id="loginForm" class="auth-form">
                    <div class="form-group">
                        <label for="loginEmail">Email</label>
                        <input type="email" id="loginEmail" required placeholder="example@mail.ru">
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">Пароль</label>
                        <input type="password" id="loginPassword" required placeholder="••••••••">
                    </div>
                    <a href="#" class="forgot-link" onclick="event.preventDefault(); showToast('Восстановление пароля — скоро', 'info');" style="display: block; margin-bottom: 20px; font-size: 0.85rem; color: var(--color-primary-light);">Забыли пароль?</a>
                    <button type="submit" class="btn btn-primary btn-block">Войти</button>
                </form>

                <form id="registerForm" class="auth-form" style="display: none;">
                    <div class="form-group">
                        <label for="regDisplayName">Имя</label>
                        <input type="text" id="regDisplayName" required placeholder="Как вас зовут?">
                    </div>
                    <div class="form-group">
                        <label for="regEmail">Email</label>
                        <input type="email" id="regEmail" required placeholder="example@mail.ru">
                    </div>
                    <div class="form-group">
                        <label for="regPassword">Пароль</label>
                        <input type="password" id="regPassword" required placeholder="••••••••">
                    </div>
                    <div class="form-group">
                        <label for="regPasswordConfirm">Подтвердите пароль</label>
                        <input type="password" id="regPasswordConfirm" required placeholder="••••••••">
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Создать аккаунт</button>
                </form>
            </div>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/ui-kit.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/voice-assistant.js"></script>
    <script>
        (function() {
            if (api.isAuthenticated) {
                const returnUrl = getQueryParam('returnUrl') || 'index.html';
                window.location.href = returnUrl;
                return;
            }

            const tabs = document.querySelectorAll('.tabs-auth .tab');
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');

            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    tabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    const target = tab.dataset.tab;
                    if (target === 'login') {
                        loginForm.style.display = '';
                        registerForm.style.display = 'none';
                    } else {
                        loginForm.style.display = 'none';
                        registerForm.style.display = '';
                    }
                });
            });

            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('loginEmail').value.trim();
                const password = document.getElementById('loginPassword').value;
                try {
                    await api.login(email, password);
                    showToast('Добро пожаловать!', 'success');
                    const returnUrl = getQueryParam('returnUrl') || 'index.html';
                    window.location.href = returnUrl;
                } catch (err) {
                    showToast(err.message || 'Ошибка входа', 'error');
                }
            });

            registerForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const displayName = document.getElementById('regDisplayName').value.trim();
                const email = document.getElementById('regEmail').value.trim();
                const password = document.getElementById('regPassword').value;
                const passwordConfirm = document.getElementById('regPasswordConfirm').value;

                if (password !== passwordConfirm) {
                    showToast('Пароли не совпадают', 'error');
                    return;
                }

                try {
                    await api.register(email, password, displayName);
                    showToast('Аккаунт создан! Добро пожаловать.', 'success');
                    const returnUrl = getQueryParam('returnUrl') || 'index.html';
                    window.location.href = returnUrl;
                } catch (err) {
                    showToast(err.message || 'Ошибка регистрации', 'error');
                }
            });
        })();
    </script>
</body>
</html>
